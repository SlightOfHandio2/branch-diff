name: Bug report
description: Report behavior that is broken or unexpected
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open a repository on branch...
        2. Choose base...
        3. Switch to...
    validations:
      required: true

  - type: input
    id: vscode
    attributes:
      label: VS Code version
    validations:
      required: true

  - type: input
    id: extension
    attributes:
      label: Branch Diff version
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true

  - type: input
    id: git
    attributes:
      label: Git version

  - type: textarea
    id: settings
    attributes:
      label: Relevant settings or additional context
      render: json
