name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Package extension
        run: npm run package -- --out branch-diff.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: branch-diff-vsix
          path: branch-diff.vsix
          if-no-files-found: error

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build website
        run: npm test --prefix website

      - name: Upload website
        uses: actions/upload-artifact@v4
        with:
          name: branch-diff-website
          path: website/dist/
          if-no-files-found: error
