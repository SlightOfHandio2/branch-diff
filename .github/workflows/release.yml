name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - name: Compile and test
        run: npm test

      - name: Package extension
        run: npm run package -- --out "branch-diff-${GITHUB_REF_NAME}.vsix"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" "branch-diff-${GITHUB_REF_NAME}.vsix" --notes-file "$notes" --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" "branch-diff-${GITHUB_REF_NAME}.vsix" --generate-notes --verify-tag
          fi
